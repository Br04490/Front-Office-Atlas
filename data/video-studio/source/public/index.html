<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Front Office Atlas — Grassroots to NBA Intelligence</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --soft:#eff6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif; background:var(--bg); color:var(--ink); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  header { height:54px; background:var(--card); border-bottom:1px solid var(--line); padding:0 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { font-weight:800; font-size:15px; display:flex; align-items:center; gap:8px; }
  .brand span { background:var(--ink); color:#fff; padding:2px 7px; border-radius:4px; font-size:11px; }
  .tiers { display:flex; gap:6px; }
  .tier-btn { border:1px solid var(--line); background:#fff; color:var(--muted); padding:5px 11px; border-radius:999px; font-size:12px; font-weight:600; cursor:pointer; }
  .tier-btn.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .search-wrap { position:relative; width:320px; }
  #searchInput { width:100%; padding:7px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; outline:none; background:var(--bg); }
  #searchResults { position:absolute; top:38px; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,.08); max-height:320px; overflow-y:auto; z-index:50; display:none; }
  .sr-item { padding:8px 12px; display:flex; justify-content:space-between; align-items:center; font-size:12.5px; cursor:pointer; border-bottom:1px solid #f3f4f6; }
  .sr-item:hover { background:var(--soft); }
  main { flex:1; display:grid; grid-template-columns:330px 1fr 370px; gap:12px; padding:12px 16px; overflow:hidden; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; overflow:hidden; }
  .panel-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .hero { display:flex; gap:12px; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .avatar { width:78px; height:78px; border-radius:12px; background:#eef2ff; object-fit:cover; border:1px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:var(--accent); }
  .badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; color:#fff; margin-bottom:4px; }
  .b-NBA { background:#1d4ed8; } .b-G-LEAGUE { background:#047857; } .b-NCAA-D1 { background:#b45309; } .b-GRASSROOTS { background:#7c3aed; }
  .p-name { font-size:18px; font-weight:800; line-height:1.15; }
  .p-sub { font-size:12px; color:var(--muted); margin-top:3px; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:12px; overflow-y:auto; }
  .stat-box { background:var(--bg); padding:7px 9px; border-radius:8px; border:1px solid #eef0f3; }
  .stat-lbl { font-size:10px; color:var(--muted); font-weight:600; }
  .stat-val { font-size:15px; font-weight:800; margin-top:1px; }
  .center-grid { display:grid; grid-template-rows:1fr auto; gap:12px; overflow:hidden; }
  .court-wrap { display:flex; align-items:center; justify-content:center; flex:1; min-height:0; }
  svg.court { width:100%; max-width:440px; height:100%; max-height:270px; }
  .zone-pill { font-size:10px; font-weight:700; fill:#111827; text-anchor:middle; }
  .cap-card { border-top:1px solid var(--line); padding-top:10px; }
  .cap-bar-bg { height:12px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:6px 0; }
  .cap-bar-fill { height:100%; background:linear-gradient(90deg,#2563eb,#0ea5e9); transition:width .3s; }
  .yr-row { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .yr-chip { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:11px; }
  .tab-row { display:flex; gap:6px; margin-bottom:8px; }
  .tab-btn { flex:1; padding:6px; font-size:11.5px; font-weight:700; border-radius:7px; border:1px solid var(--line); background:var(--bg); cursor:pointer; }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .node-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .node-card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:.15s; }
  .node-card:hover { border-color:var(--accent); background:var(--soft); }
  .node-left { display:flex; align-items:center; gap:8px; }
  .node-thumb { width:34px; height:34px; border-radius:50%; object-fit:cover; background:#e5e7eb; }
  .fit-pill { font-size:11px; font-weight:800; color:var(--accent); background:var(--soft); padding:3px 7px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <div class="brand">FRONT OFFICE ATLAS <span>GRASSROOTS → NBA</span></div>
  <div class="tiers" id="tierFilters">
    <button class="tier-btn active" data-tier="ALL">All Tiers</button>
    <button class="tier-btn" data-tier="NBA">NBA</button>
    <button class="tier-btn" data-tier="G-LEAGUE">G League</button>
    <button class="tier-btn" data-tier="NCAA-D1">NCAA D1</button>
    <button class="tier-btn" data-tier="GRASSROOTS">Grassroots / EYBL</button>
  </div>
  <div class="search-wrap">
    <input id="searchInput" placeholder="Search Grassroots, D1, G League, or NBA..." autocomplete="off" />
    <div id="searchResults"></div>
  </div>
</header>
<main>
  <section class="panel">
    <div class="panel-title"><span>Player Dossier</span><span id="playerCount">Loading...</span></div>
    <div class="hero" id="playerHero"></div>
    <div class="stat-grid" id="statGrid"></div>
  </section>
  <section class="panel center-grid">
    <div style="display:flex;flex-direction:column;overflow:hidden;">
      <div class="panel-title"><span>11-Zone Spatial Shot Profile</span><span>FG% / Volume</span></div>
      <div class="court-wrap">
        <svg class="court" viewBox="0 0 500 320">
          <rect x="10" y="10" width="480" height="300" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="2"/>
          <path d="M 45 10 L 45 115 A 205 205 0 0 0 455 115 L 455 10" fill="none" stroke="#9ca3af" stroke-width="2"/>
          <rect x="170" y="10" width="160" height="150" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
          <circle cx="250" cy="48" r="10" fill="none" stroke="#ef4444" stroke-width="2.5"/>
          <g id="zoneOverlay"></g>
        </svg>
      </div>
    </div>
    <div class="cap-card" id="capSection"></div>
  </section>
  <section class="panel">
    <div class="panel-title"><span>50-Node Relational Engine</span><span id="modeLabel">Closest Comps</span></div>
    <div class="tab-row">
      <button class="tab-btn active" id="tabComps">Top 50 Comps (All Tiers)</button>
      <button class="tab-btn" id="tabTrades">50 Trade Web Packages</button>
    </div>
    <div class="node-list" id="nodeList"></div>
  </section>
</main>
<script src="./atlasQueryEngine.js"></script>
<script>
const ZC=[["AT THE RIM",250,68],["PAINT",250,122],["LEFT BASELINE MID",105,85],["RIGHT BASELINE MID",395,85],["LEFT ELBOW MID",155,165],["RIGHT ELBOW MID",345,165],["LEFT CORNER 3",28,70],["RIGHT CORNER 3",472,70],["LEFT WING 3",95,235],["RIGHT WING 3",405,235],["TOP OF KEY 3",250,265]];
let activeTier="ALL",currentPlayer=null,rightMode="comps";
const fmt=n=>!n?"$0":"$"+(n>=1e6?(n/1e6).toFixed(2)+"M":Math.round(n/1e3)+"K");
const ini=s=>(s||"FA").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
function renderPlayer(p){
  if(!p)return; currentPlayer=p;
  const img=p.photo?`<img class="avatar" src="${p.photo}" onerror="this.outerHTML='<div class=avatar>${ini(p.name)}</div>'" />`:`<div class="avatar">${ini(p.name)}</div>`;
  document.getElementById("playerHero").innerHTML=`${img}<div><span class="badge b-${p.league}">${p.league}</span><div class="p-name">${p.name}</div><div class="p-sub">${p.team} • Age ${p.age||"—"} • ${p.gp||0} GP • ${p.min||0} MIN</div></div>`;
  const s=p.stats||{},pct=v=>v?(v<=1?(v*100).toFixed(1)+"%":v+"%"):"—";
  const m=[["PTS",s.pts],["REB",s.reb],["AST",s.ast],["STL",s.stl],["BLK",s.blk],["TOV",s.tov],["FG%",pct(s.fg_pct)],["3P%",pct(s.fg3_pct)],["FT%",pct(s.ft_pct)],["TS%",pct(s.ts_pct)],["USG%",pct(s.usg_pct)],["NET RTG",s.net_rating??"—"],["OFF RTG",s.off_rating??"—"],["DEF RTG",s.def_rating??"—"],["PIE",s.pie??"—"]];
  document.getElementById("statGrid").innerHTML=m.map(([k,v])=>`<div class="stat-box"><div class="stat-lbl">${k}</div><div class="stat-val">${v??"—"}</div></div>`).join("");
  document.getElementById("zoneOverlay").innerHTML=ZC.map(([zn,x,y],i)=>{const z=p.zones?.[zn],v=z?z.pct:Math.round((p.zone_vec?.[i]||0)*100),f=v>=50?"#bbf7d0":v>=38?"#dbeafe":"#fef3c7";return `<g transform="translate(${x},${y})"><rect x="-42" y="-15" width="84" height="30" rx="6" fill="${f}" stroke="#9ca3af"/><text class="zone-pill" y="-2">${zn.replace("BASELINE ","BASE ").replace("TOP OF KEY","TOP KEY")}</text><text class="zone-pill" y="10" fill="#1d4ed8">${v}%</text></g>`}).join("");
  const cap=p.contract?.cap_26_27||0,w=Math.min(100,Math.round((cap/154647000)*250)),yrs=Object.entries(p.contract?.years||{});
  document.getElementById("capSection").innerHTML=`<div class="panel-title"><span>2026-27 Cap / NIL / Scale Valuation</span><span>${fmt(cap)}</span></div><div class="cap-bar-bg"><div class="cap-bar-fill" style="width:${Math.max(6,w)}%"></div></div><div class="yr-row">${yrs.length?yrs.map(([y,v])=>`<div class="yr-chip"><b>${y}:</b> ${fmt(v)}</div>`).join(""):`<div class="yr-chip"><b>2026-27 Est:</b> ${fmt(cap)}</div>`}</div>`;
  renderRight();
}
function renderRight(){
  const list=document.getElementById("nodeList"); if(!currentPlayer)return;
  if(rightMode==="comps"){
    document.getElementById("modeLabel").textContent="50 Closest Comps";
    list.innerHTML=AtlasDB.findClosestPlayers(currentPlayer.id,{limit:50,league:activeTier}).map(c=>`<div class="node-card" onclick="selectById('${c.player.id}')"><div class="node-left">${c.player.photo?`<img class="node-thumb" src="${c.player.photo}" onerror="this.style.display='none'"/>`:""}<div><div style="font-weight:700;font-size:12.5px;">${c.player.name} <span class="badge b-${c.player.league}" style="font-size:9px;">${c.player.league}</span></div><div style="font-size:11px;color:#6b7280;">${c.player.team} • ${c.player.stats.pts||0} PTS / ${c.player.stats.reb||0} REB / ${c.player.stats.ast||0} AST</div></div></div><div class="fit-pill">${c.fitPct}% Fit</div></div>`).join("");
  } else {
    document.getElementById("modeLabel").textContent="50 CBA Trade Packages";
    const tr=AtlasDB.buildTradeWeb([currentPlayer.id],{limit:50,goal:"win_now"});
    list.innerHTML=tr.length?tr.map(t=>`<div class="node-card" onclick="selectById('${t.incoming[0].id}')"><div><div style="font-weight:700;font-size:12.5px;">${t.partnerTeam} (${t.size}-Player Package)</div><div style="font-size:11px;color:#374151;">${t.incoming.map(x=>x.name).join(" + ")}</div><div style="font-size:10.5px;color:#6b7280;">In: ${fmt(t.inSalary)} • Match: ${t.matchPct}%</div></div><div class="fit-pill">${t.fitScore} Score</div></div>`).join(""):`<div style="font-size:12px;color:#6b7280;padding:12px;">Select an NBA player to generate 50 CBA-legal trade packages.</div>`;
  }
}
window.selectById=id=>renderPlayer(AtlasDB.getPlayer(id));
(async()=>{
  const db=await AtlasDB.init("./data/atlas_graph.min.json");
  document.getElementById("playerCount").textContent=`${db.players.length} Players`;
  renderPlayer(db.players.find(p=>p.league==="NBA"&&p.stats.pts>22)||db.players[0]);
  document.querySelectorAll(".tier-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tier-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeTier=b.dataset.tier;const f=activeTier==="ALL"?currentPlayer:db.players.find(p=>p.league===activeTier);if(f)renderPlayer(f)});
  document.getElementById("tabComps").onclick=()=>{rightMode="comps";document.getElementById("tabComps").classList.add("active");document.getElementById("tabTrades").classList.remove("active");renderRight()};
  document.getElementById("tabTrades").onclick=()=>{rightMode="trades";document.getElementById("tabTrades").classList.add("active");document.getElementById("tabComps").classList.remove("active");renderRight()};
  const inp=document.getElementById("searchInput"),box=document.getElementById("searchResults");
  inp.oninput=()=>{const q=inp.value.trim().toLowerCase();if(!q){box.style.display="none";return}const h=db.players.filter(p=>(activeTier==="ALL"||p.league===activeTier)&&(p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q))).slice(0,20);box.innerHTML=h.map(p=>`<div class="sr-item" onclick="selectById('${p.id}');document.getElementById('searchResults').style.display='none';"><span><b>${p.name}</b> (${p.team})</span><span class="badge b-${p.league}">${p.league}</span></div>`).join("");box.style.display=h.length?"block":"none"};
})();
</script>
</body>
</html>
